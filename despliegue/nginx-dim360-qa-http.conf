# Sitio provisorio de DIM360 QA, solo HTTP: para emitir el certificado la primera vez.
# Después se reemplaza por nginx-dim360-qa.conf (docs/DESPLIEGUE-VPS.md).

server {
    listen 80;
    listen [::]:80;
    server_name dim360.195-35-42-168.sslip.io;

    location / {
        proxy_pass http://127.0.0.1:3017;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
