# Proxy a la app de DIM360 QA. Va en /etc/nginx/snippets/dim360-qa-proxy.conf.
proxy_pass http://127.0.0.1:3017;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Se pisa (no se agrega a lo que mande el cliente): la app toma la primera IP de
# X-Forwarded-For para el límite de intentos del ingreso del panel.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
# Los informes en PDF con anexo de imágenes pueden tardar.
proxy_read_timeout 180s;
