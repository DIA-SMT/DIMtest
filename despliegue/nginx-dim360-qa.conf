# Sitio definitivo de DIM360 QA en la VPS: HTTP redirige a HTTPS.
# Requiere el certificado ya emitido:  certbot certonly --nginx -d dim360.195-35-42-168.sslip.io
# Instalación: docs/DESPLIEGUE-VPS.md (primero nginx-dim360-qa-http.conf para sacar el certificado).
#
# Sin default_server: en nginx 1.24 esa marca es del puerto entero.
# "http2" va en la línea listen: "http2 on;" es de nginx 1.25 y acá no compila.

server {
    listen 80;
    listen [::]:80;
    server_name dim360.195-35-42-168.sslip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dim360.195-35-42-168.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/dim360.195-35-42-168.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dim360.195-35-42-168.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/dim360-qa.access.log;
    error_log  /var/log/nginx/dim360-qa.error.log;

    # Evidencias: hasta 5 archivos de 8 MB por prueba, más el formulario (next.config.ts: 42 MB).
    client_max_body_size 45M;

    # Encabezados de seguridad: los pone nginx (la app corre con ENCABEZADOS_SEGURIDAD=nginx).
    # Cada location los incluye: así no se heredan los globales de conf.d/.

    # Estáticos de Next directo desde disco (la carpeta del proyecto es 751).
    location /_next/static/ {
        alias /srv/dim360-qa/actual/.next/static/;
        expires 1y;
        access_log off;
        include snippets/dim360-qa-encabezados.conf;
        add_header X-Content-Type-Options nosniff always;
    }

    # Evidencias: el route handler manda su propia CSP (sandbox) y nosniff.
    location /evidencias/ {
        include snippets/dim360-qa-proxy.conf;
        include snippets/dim360-qa-encabezados.conf;
    }

    location / {
        include snippets/dim360-qa-proxy.conf;
        include snippets/dim360-qa-encabezados.conf;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    }
}
