# Encabezados de seguridad de DIM360 QA (los mismos que next.config.ts, que en la VPS se apaga
# con ENCABEZADOS_SEGURIDAD=nginx). Va en /etc/nginx/snippets/dim360-qa-encabezados.conf.
# Se incluye en cada location: en nginx, un add_header en un bloque corta la herencia de los
# globales de conf.d/ (que mandan X-Frame-Options DENY y chocarían con SAMEORIGIN).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
